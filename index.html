<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>忆织 · 雨夜山庄</title>
  <link rel="icon" type="image/svg+xml" href="./assets/emblem.svg">
  <link rel="stylesheet" href="./room-2d.css">
  <link rel="stylesheet" href="./dialogue.css">
  <link rel="stylesheet" href="./recap.css">
</head>
<body>
  <main id="game" aria-label="雨夜山庄二维调查">
    <div class="room-art" aria-hidden="true"><img src="./assets/scenes/hall-2d-v1.png" alt=""><div class="window-rain"></div><div class="lamplight"></div></div>
    <div class="shade" aria-hidden="true"></div>
    <section id="title-screen" aria-labelledby="game-title">
      <div class="title-copy"><p class="title-kicker">MNEMOWEAVE · 忆织</p><h1 id="game-title">雨夜山庄</h1><p class="title-chapter">第一章 · 消失的月光石</p><p class="title-intro">雨封住了山路，展柜里的月光石不见了。<br>和三位搭档查清，这一晚有谁动过它。</p><div class="title-actions"><button id="enter-game" class="primary" data-command="enter">开始调查</button><button id="menu-restart" data-command="restart" hidden>重新开始</button><button data-command="guide">调查指南</button><button data-command="opening">雨夜序章</button><button data-command="toggleDemo" title="从材料齐备的小队讨论开始，听完后由你选择人选">演示破案</button></div><p id="resume-status" class="menu-note">进度自动保存在当前浏览器</p></div>
      <div class="title-bottom"><span>检查现场 · 询问当事人 · 核对记录</span><span>固定剧情试玩版 / 建议使用电脑游玩</span></div>
    </section>
    <div id="play-ui" hidden>
    <header>
      <a class="wordmark" href="./" aria-label="返回首页">忆织<span>MNEMOWEAVE</span></a>
      <div class="chapter"><span class="small">第一章 / 月光石</span><h1>雨夜 · 展厅</h1><p>21:00 &nbsp; 山庄东翼 &nbsp; / &nbsp; 雨仍未停</p></div>
      <nav aria-label="调查工具"><button id="map">⌘ <span>山庄地点</span></button><button id="team">♧ <span>联系队员</span><b id="pending-count">0</b></button><button id="journal">▤ <span>调查手记</span><b id="count">0</b></button><button id="conclude">◇ <span>召集讨论</span></button></nav>
    </header>
    <section class="hotspots" aria-label="可调查的场景物件"></section>
    <footer>
      <button class="companion" id="talk"><span class="avatar-frame"><img src="./assets/portraits/ajing-painted-v7.png" alt="阿镜"></span><span><small>同行搭档</small><strong>阿镜</strong><em id="partner-state">还没有交换发现</em></span><b>交谈 ↗</b></button>
      <div class="objective"><button class="small story-stage" id="story-stage" data-command="progress">案情进展 · 梳理下一步</button><p id="objective"></p><div class="steps"><span id="action-budget"></span><span>交流、传递与切换地点免费</span><span>留 1 次行动结案</span></div></div>
      <div class="edition"><span id="save-status">固定剧情 · 自动保存</span><small><button id="hints" aria-pressed="true">调查标记 开</button> · <button id="restart">重新开始</button></small><button id="demo-action" data-command="toggleDemo" title="演示小队讨论，可随时退出返回原进度">演示破案</button></div>
    </footer>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="panel" aria-labelledby="panel-title"><button id="close" class="close" aria-label="关闭面板">×</button><div id="panel-body"></div></dialog>
    <noscript>请启用 JavaScript 后进行调查。</noscript>
  </main>
  <script type="module" src="./room-2d.mjs"></script>
</body>
</html>
